# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Android Build

on:
  push:
    paths:
      - "NeverSpiral/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NeverSpiral

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: never-spiral-debug-apk
          path: NeverSpiral/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The release tag used to be build-${{ github.run_number }}, which has no relationship to
      # the app's own versionName -- UpdateChecker on-device had no reliable way to tell "already
      # installed" from "genuinely newer" and would always offer the latest release as installable.
      # Tagging with the real app version (from build.gradle.kts) is what makes that comparison
      # possible.
      - name: Extract app version
        id: appversion
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appversion.outputs.versionName }}
          name: "Sam's Music Viz v${{ steps.appversion.outputs.versionName }}"
          body: |
            Automated debug build from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.
          generate_release_notes: true
          files: NeverSpiral/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK to build-artifacts branch
        working-directory: ${{ github.workspace }}
        run: |
          cp NeverSpiral/app/build/outputs/apk/debug/app-debug.apk /tmp/never-spiral-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan never-spiral-apk-builds
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/never-spiral-debug.apk ./never-spiral-debug.apk
          git add never-spiral-debug.apk
          git commit -m "Publish built APK from ${{ github.sha }}"
          git push --force origin HEAD:never-spiral-apk-builds
